<!doctype html>
<html>
<head><meta charset="utf-8"><title>cross-origin</title></head>
<body>
<!-- Media loaded from a DIFFERENT origin with no crossorigin attribute: it
     plays fine (reaches HAVE_METADATA) but Levelhead must refuse to tap it,
     because tapping a CORS-cross-origin source would output silence. -->
<audio id="v" src="CROSS_ORIGIN_SRC" preload="auto" autoplay muted playsinline></audio>
<script>
window.__mediaState = () => {
  const v = document.getElementById('v');
  return { src: v.currentSrc, readyState: v.readyState, networkState: v.networkState };
};
window.__levelheadProbe = () => {
  const v = document.getElementById('v');
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.createMediaElementSource(v);
    ctx.close();
    return { tapped: false };
  } catch (e) {
    return { tapped: true, error: String(e && e.message || e) };
  }
};
</script>
</body>
</html>
