<!doctype html>
<html>
<head><meta charset="utf-8"><title>same-origin</title></head>
<body>
<!-- Real same-origin media so Levelhead's eligibility gate can reach
     readyState >= HAVE_METADATA and (for a safe origin) tap it. -->
<audio id="v" src="/media.wav" preload="auto" autoplay muted playsinline></audio>
<script>
window.__mediaState = () => {
  const v = document.getElementById('v');
  return { src: v.currentSrc, readyState: v.readyState, networkState: v.networkState };
};
// Page-side ownership probe: if Levelhead already tapped this element, the
// page's own createMediaElementSource on it throws "already connected".
window.__levelheadProbe = () => {
  const v = document.getElementById('v');
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.createMediaElementSource(v);
    ctx.close();
    return { tapped: false };
  } catch (e) {
    return { tapped: true, error: String(e && e.message || e) };
  }
};
</script>
</body>
</html>
