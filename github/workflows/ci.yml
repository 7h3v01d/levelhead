# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit + jsdom integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Install dev deps (jsdom for the integration tier). Skip Puppeteer's
      # Chromium download — the browser tier is not run in CI, only the
      # jsdom + unit tiers, which need no browser binary.
      - name: Install
        run: npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Run tests
        run: npm test
